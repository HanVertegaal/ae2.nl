site_name: AE Help
site_url: https://ae2.nl
site_description: Product documentation and support for Acoustics Engineering devices and software

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/common/acoustics-engineering-logo.svg
  palette:
    scheme: default
    primary: black
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Echo:
      - Overview: echo/index.md
      - Quick Start: echo/quick-start.md
      - User Interface: echo/user-interface.md
      - Signal Setup: echo/signal-setup.md
      - System Menu: echo/system-menu.md
      - Network: echo/network.md
      - Technical Specifications: echo/specifications.md
      - Troubleshooting: echo/troubleshooting.md
      - Remote Control: echo/api.md
  - Atlas:
      - Overview: atlas/index.md
      - Getting Started: atlas/getting-started.md
      - Display and Controls: atlas/display-controls.md
      - Signals: atlas/signals.md
      - Network: atlas/network.md
      - REST API: atlas/api.md
      - Troubleshooting: atlas/troubleshooting.md
  - Dirac:
      - Overview: dirac/index.md
      - Getting Started: dirac/getting-started.md
      - Troubleshooting: dirac/troubleshooting.md
